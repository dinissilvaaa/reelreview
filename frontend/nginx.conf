# -----------------------------------------------------------------------------
# nginx configuration used inside the frontend Docker container.
#  - serves the built React app (static files)
#  - forwards /api/* and /uploads/* to the backend container
#  - sends index.html for unknown paths so React Router can handle them
# -----------------------------------------------------------------------------
server {
    # Port inside the container (docker-compose maps it to 8080 on your PC)
    listen 80;
    # Answer for any host name
    server_name _;

    # Folder with the built React app
    root /usr/share/nginx/html;
    # Default file
    index index.html;

    # Allow poster uploads (2 MB image + form fields)
    client_max_body_size 5m;

    # Compress text responses to make the site load faster
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # REST API -> backend container ("backend" is the service name in docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded poster images -> backend container
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    # Built JS/CSS files have a hash in their name, so they can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
